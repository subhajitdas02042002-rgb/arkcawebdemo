<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send files to Subajit</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--line:#e8ecf2;--tx:#1e293b;--mut:#64748b;--chip:#eef0ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--mut:#94a3b8;--chip:#273449;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:420px;margin:0 auto;padding:20px 16px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;color:#b45309;background:#fffbeb;border:1px solid #fde68a}
.live i{width:7px;height:7px;border-radius:50%;background:#d97706}
.live.on{color:#15803d;background:#ecfdf3;border-color:#c9f1d9}.live.on i{background:#16a34a}
.live.bad{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.live.bad i{background:#dc2626}
.drop{display:block;border:2px dashed #a5b4fc;background:var(--chip);border-radius:14px;padding:30px 12px;margin:16px 0 8px;text-align:center;font-weight:600;cursor:pointer}
.drop.dis{opacity:.5;pointer-events:none}
small{color:var(--mut)}
.f{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.f b{font-weight:600;word-break:break-all;font-size:13px}
.tag{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;background:#fef3c7;color:#b45309;white-space:nowrap}
.tag.ok{background:#d1fae5;color:#047857}.tag.bad{background:#fee2e2;color:#b91c1c}
button{border:0;background:#4f46e5;color:#fff;padding:9px 14px;border-radius:8px;font:600 12px inherit;cursor:pointer}
</style></head><body><div class="wrap">
<div class="brand"><div class="logo">SP</div><div><b style="font-size:16px">Subajit</b><br><small>Send a file to print at the counter</small></div></div>
<div class="card">
 <span id="live" class="live"><i></i>Connecting…</span>
 <label id="drop" class="drop dis">Tap to choose files<input id="pick" type="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,image/*,application/pdf"></label>
 <small>PDF, images or text. Up to 25 MB each. Keep this page open until it says Printed.</small>
 <div id="list" style="margin-top:10px"></div>
 <div id="retry" style="display:none;margin-top:10px"><button onclick="init()">Try again</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
var shop=new URLSearchParams(location.search).get("shop"),peer=null,conn=null,ready=false,T=null,files={};
var ICE={config:{iceServers:[
  {urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}
]}};
var ipP=fetch("https://api.ipify.org?format=json").then(function(r){return r.json()}).then(function(j){return j.ip}).catch(function(){return ""});
var OK=["pdf","png","jpg","jpeg","webp","gif","txt"],MAX=25*1048576;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(cls,txt,on){$("live").className="live "+cls;$("live").innerHTML="<i></i>"+txt;ready=!!on;$("drop").className="drop"+(on?"":" dis");$("retry").style.display=(cls=="bad")?"block":"none"}
function init(){
  if(!shop){st("bad","This link is incomplete. Scan the shop QR again.",false);$("retry").style.display="none";return}
  if(typeof Peer=="undefined"){st("bad","Could not load. Check your internet.",false);return}
  st("","Connecting to the counter…",false);
  try{if(peer)peer.destroy()}catch(e){}
  peer=new Peer(ICE);
  peer.on("open",connect);
  peer.on("error",function(e){if(!ready)st("bad",e.type=="peer-unavailable"?"Counter is offline. Ask the shop to open the dashboard.":"Connection problem.",false)});
}
function connect(){
  conn=peer.connect(shop,{reliable:true});
  clearTimeout(T);T=setTimeout(function(){if(!ready)st("bad","Counter is offline. Ask the shop to open the dashboard.",false)},25000);
  conn.on("open",function(){clearTimeout(T);st("on","Connected to Subajit",true)});
  conn.on("close",function(){st("bad","Disconnected from the counter.",false)});
  conn.on("data",function(d){
    if(!d||!files[d.id])return;var f=files[d.id];
    if(d.status=="received")set(f,"Received","");
    if(d.status=="printed")set(f,"Printed","ok");
    if(d.status=="rejected"||d.status=="failed")set(f,d.msg||"Not printed","bad");
  });
}
function set(f,txt,cls){f.row.querySelector(".tag").className="tag "+cls;f.row.querySelector(".tag").textContent=txt}
function addRow(name,txt,cls){
  var r=document.createElement("div");r.className="f";
  r.innerHTML="<b>"+esc(name)+'</b><span class="tag '+cls+'">'+txt+"</span>";$("list").prepend(r);return r;
}
$("pick").onchange=function(e){
  Array.prototype.forEach.call(e.target.files,async function(file){
    var ext=file.name.split(".").pop().toLowerCase();
    if(OK.indexOf(ext)<0){addRow(file.name,"Type not accepted","bad");return}
    if(file.size>MAX){addRow(file.name,"Over 25 MB","bad");return}
    var id=Math.random().toString(36).slice(2),row=addRow(file.name,"Sending…","");
    files[id]={row:row};
    try{conn.send({file:true,id:id,name:file.name,type:file.type,data:await file.arrayBuffer(),ip:await ipP})}
    catch(err){set(files[id],"Failed to send","bad")}
  });
  e.target.value="";
};
init();
</script></body></html>
